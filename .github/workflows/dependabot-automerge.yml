name: Dependabot auto-merge

# Dependabot PR を「ビルド検証が通った場合のみ」マージする。
# 旧実装 (cron でマージ → 事後検証) は壊れた更新が先に main に入る順序だったため、
# 検証 → マージの順のイベント駆動に置き換えた。
# branch protection は Pages CMS の main 直コミットを壊すので使わない。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # ビルドが通っても「挙動不変」の保証はメジャーには無いので、
      # minor / patch のみ自動マージ。メジャーは PR を残して人間レビュー。
      - name: Merge (minor / patch only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
