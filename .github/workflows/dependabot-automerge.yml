name: Dependabot auto-merge

# Dependabot PR を「ビルド検証が通った場合のみ」マージする。
# 旧実装 (cron でマージ → 事後検証) は壊れた更新が先に main に入る順序だったため、
# 検証 → マージの順のイベント駆動に置き換えた。
# branch protection は Pages CMS の main 直コミットを壊すので使わない。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # ここまで全部通った場合のみマージされる（失敗時は PR が open のまま残る）
      - run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
