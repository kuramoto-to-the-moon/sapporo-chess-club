name: Auto-merge Dependabot PRs

on:
  schedule:
    # 毎週月曜 9:00 JST (日曜 24:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: List open Dependabot PRs
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --author "app/dependabot" --state open --json number,title --jq '.[].number' | xargs)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          if [ -z "$prs" ]; then
            echo "Dependabot PR なし — スキップ"
          else
            echo "マージ対象: $prs"
          fi

      - name: Merge each PR
        if: steps.list.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr in ${{ steps.list.outputs.prs }}; do
            echo "--- PR #$pr をマージ ---"
            # --auto はチェック待ちがある場合のみ有効。クリーン状態なら直マージ
            gh pr merge "$pr" --merge --auto 2>/dev/null || gh pr merge "$pr" --merge || {
              echo "PR #$pr のマージに失敗（CI 未通過の可能性）— スキップ"
              continue
            }
          done

      - name: Wait for merges to settle
        if: steps.list.outputs.prs != ''
        run: sleep 10

      - name: Pull latest and verify build
        if: steps.list.outputs.prs != ''
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        if: steps.list.outputs.prs != ''
        with:
          node-version: "22"

      - name: Install and build
        if: steps.list.outputs.prs != ''
        run: |
          corepack enable && corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify site output
        if: steps.list.outputs.prs != ''
        run: |
          # 基本的なページが生成されているか確認
          for page in index.html en/index.html schedule/index.html tournaments/index.html announcements/index.html rss.xml en/rss.xml sitemap-index.xml; do
            if [ ! -f "dist/$page" ]; then
              echo "FAIL: dist/$page が見つかりません"
              exit 1
            fi
          done
          total=$(find dist -name '*.html' | wc -l)
          echo "OK: $total ページ生成を確認"
