media:
  - name: competition
    label: 大会ファイル (PDF / PGN)
    input: public/competition
    output: /competition

content:
  - name: meetings
    label: スケジュール（例会）
    description: "月2回の定期例会の日程をここで管理します。過去分も削除せず残してください。"
    type: file
    path: src/content/schedule/meetings.yaml
    format: yaml
    fields:
      - name: dates
        label: 例会日程
        type: object
        list: true
        fields:
          - name: date
            label: 日付
            type: date
            required: true
            description: "曜日は日付から自動計算されるので入力不要です。"
          - name: startTime
            label: 開始時間
            type: string
            required: true
            description: "24 時間制"
          - name: endTime
            label: 終了時間
            type: string
            required: true
            description: "24 時間制"
          - name: room
            label: 部屋番号
            type: string
            required: true
          - name: note
            label: 備考（任意）
            type: object
            description: "「注意：810Aではなく740」など、その日だけの特記事項。"
            fields:
              - { name: ja, label: 日本語, type: string }
              - { name: en, label: English, type: string }

  - name: tournaments-upcoming
    label: スケジュール（大会）
    description: "今後開催する大会の日程をここで管理します。終了した大会は別途「大会記録」コレクションに追加してください。"
    type: file
    path: src/content/schedule/tournaments-upcoming.yaml
    format: yaml
    fields:
      - name: dates
        label: 大会日程
        type: object
        list: true
        fields:
          - name: date
            label: 開催日
            type: date
            required: true
            description: "複数日大会は 1 日 1 エントリ作成。"
          - name: eventName
            label: 大会名
            type: object
            required: true
            fields:
              - { name: ja, label: 日本語, type: string, required: true }
              - { name: en, label: English, type: string }
          - name: startTime
            label: 開始時間
            type: string
            required: true
            description: "24 時間制"
          - name: endTime
            label: 終了時間
            type: string
            required: true
            description: "24 時間制"
          - name: room
            label: 部屋番号
            type: string
            required: true
          - name: note
            label: 備考（任意）
            type: object
            fields:
              - { name: ja, label: 日本語, type: string }
              - { name: en, label: English, type: string }

  - name: tournaments
    label: 大会記録
    description: "過去の大会の記録（要項 PDF / 結果 PDF / 棋譜 PGN）を管理します。"
    type: collection
    path: src/content/tournaments
    format: yaml-frontmatter
    view:
      fields: [series, date]
      primary: series
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 大会名
        type: object
        required: true
        fields:
          - { name: ja, label: 日本語, type: string, required: true }
          - { name: en, label: English, type: string }
      - name: date
        label: 開催日
        type: date
        required: true
      - name: detailsPdf
        label: 要項 PDF
        type: file
        options:
          media: competition
        description: "開催前の要項。competition フォルダにアップロードしてください。"
      - name: resultsPdf
        label: 結果 PDF
        type: file
        options:
          media: competition
      - name: gamesPgn
        label: 棋譜 PGN
        type: file
        options:
          media: competition
        description: "解析なしの棋譜ファイル (*NoAnalysis.pgn)"
      - name: gamesPgnAnnotated
        label: 棋譜 PGN (解析付)
        type: file
        options:
          media: competition
        description: "評価値コメント付きの棋譜 (*Analysis.pgn)。あれば追加。"

  - name: announcements
    label: お知らせ
    description: "新着情報・お知らせ。英語版は任意（現在自動翻訳は無効）。"
    type: collection
    path: src/content/announcements
    format: yaml-frontmatter
    view:
      fields: [date, title.ja]
      primary: title.ja
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: 公開日
        type: date
        required: true
        description: "新しい順に並びます。"
      - name: title
        label: タイトル
        type: object
        fields:
          - { name: ja, label: 日本語, type: string, required: true }
          - { name: en, label: English (任意), type: string }
      - name: body
        label: 本文 (日本語)
        type: rich-text
        required: true
        description: "お知らせの本文。見出し・太字・リンク・箇条書き・表が使えます。"
      - name: bodyEn
        label: 本文 English (任意)
        type: rich-text
        description: "英語版の本文。空欄なら英語ページでは日本語本文が表示されます。現在自動翻訳は無効です。"

  - name: lessons
    label: チェス講座
    type: collection
    path: src/content/lessons
    format: yaml-frontmatter
    fields:
      - name: title
        label: タイトル
        type: object
        fields:
          - { name: ja, label: 日本語, type: string, required: true }
          - { name: en, label: English, type: string, required: true }
      - name: description
        label: 説明文
        type: object
        fields:
          - { name: ja, label: 日本語, type: text, required: true }
          - { name: en, label: English, type: text, required: true }
      - name: url
        label: 外部講座 URL（任意）
        type: string
        description: "道新文化センターなど、外部講座ページの URL。設定すると講座セクションに「詳細を見る ↗」リンクが表示されます。"

  - name: links
    label: 外部リンク
    description: "トップページの「リンク / 資料」セクションに表示される外部リンクです。ここに追加したものが全て表示されます。"
    type: file
    path: src/content/links/links.yaml
    format: yaml
    fields:
      - name: links
        label: リンク一覧
        type: object
        list: true
        fields:
          - name: title
            label: タイトル
            type: object
            fields:
              - { name: ja, label: 日本語, type: string, required: true }
              - { name: en, label: English, type: string, required: true }
          - name: url
            label: URL
            type: string
            required: true

  - name: site
    label: サイト基本情報
    description: "連絡先・会場・参加費。変更が少ない項目です。"
    type: file
    path: src/content/site/info.yaml
    format: yaml
    fields:
      - name: email
        label: メールアドレス
        type: string
        required: true
      - name: phone
        label: 電話番号
        type: string
        required: true
      - name: venue
        label: 会場情報
        type: object
        fields:
          - name: name
            label: 施設名
            type: object
            fields:
              - { name: ja, label: 日本語, type: string, required: true }
              - { name: en, label: English, type: string, required: true }
          - name: floor
            label: フロア・部屋
            type: string
          - name: address
            label: 住所
            type: object
            fields:
              - { name: ja, label: 日本語, type: string, required: true }
              - { name: en, label: English, type: string, required: true }
          - name: access
            label: アクセス
            type: object
            fields:
              - { name: ja, label: 日本語, type: string, required: true }
              - { name: en, label: English, type: string, required: true }
      - name: fee
        label: 参加費
        type: object
        fields:
          - { name: general, label: 一般 (円), type: number, required: true }
          - { name: student, label: 学生 (円), type: number, required: true }
